<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">  
</head>
<style>
.button-8 {
  background-color: #e1ecf4;
  border-radius: 3px;
  border: 1px solid #7aa7c7;
  box-shadow: rgba(255, 255, 255, .7) 0 1px 0 0 inset;
  box-sizing: border-box;
  color: #39739d;
  cursor: pointer;
  display: inline-block;
  font-family: -apple-system,system-ui,"Segoe UI","Liberation Sans",sans-serif;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.15385;
  margin: 0;
  outline: none;
  padding: 8px .8em;
  position: relative;
  text-align: center;
  text-decoration: none;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  vertical-align: baseline;
  white-space: nowrap;
}

.button-8:hover,
.button-8:focus {
  background-color: #b3d3ea;
  color: #2c5777;
}

.button-8:focus {
  box-shadow: 0 0 0 4px rgba(0, 149, 255, .15);
}

.button-8:active {
  background-color: #a0c7e4;
  box-shadow: none;
  color: #2c5777;
}
</style>
<script>
function gcd(a,b) {
	if (!b) return a;

	return gcd(b, a % b);
}

function calc() {
    var output = document.getElementById('output');
    try {
        var factorix = BigInt(document.getElementById('factorix').value);
        var friend = BigInt(document.getElementById('friend').value);
        var v = gcd(factorix, friend);
        output.innerHTML = v;
    }
    catch(err) {
        output.innerHTML = 'Unable to calculate GCD';
    }
}
</script>
<body>
<input type="text" id="factorix" placeholder="Factorix" />
<input type="text" id="friend" placeholder="Friend" />
<button class="button-8" onclick="return calc();">Calculate</button><br/>
<textarea id="output" style="width:435px" ></textarea>
</body>
</html>
